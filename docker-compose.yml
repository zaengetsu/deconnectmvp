# Infra de développement : uniquement Postgres.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rekonect
      POSTGRES_PASSWORD: rekonect
      POSTGRES_DB: rekonect
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rekonect"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
